[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pc-builder"
version = "0.1.0"
description = "PC Parts Comparison"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "lxml>=6.0.0",
    "PyYAML>=6.0.2",
    "pydantic>=2.11.0",
    "SQLAlchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.1.0",
    "tenacity>=9.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]